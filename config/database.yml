# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


production_default: &production_default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
  sslmode: <%= ENV.fetch("PGSSLMODE", "require") %>

# Use Render Postgres in production via DATABASE_URL.
production:
  primary:
    <<: *production_default
  cache:
    <<: *production_default
    migrations_paths: db/cache_migrate
    schema_migrations_table_name: cache_schema_migrations
  queue:
    <<: *production_default
    migrations_paths: db/queue_migrate
    schema_migrations_table_name: queue_schema_migrations
  cable:
    <<: *production_default
    migrations_paths: db/cable_migrate
    schema_migrations_table_name: cable_schema_migrations
